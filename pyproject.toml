[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorlite"
version = "0.3.0"
description = "Exact and approximate kNN vector search from scratch, with measured recall"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["vectorlite*"]

[project.scripts]
vectorlite-buckets = "vectorlite.bucket_cli:main"
